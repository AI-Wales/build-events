title: AI Wales Tech
description: >-
  Talks, workshops and hackathons from the AI Wales technical community - models, code and data.
lang: en-GB
timezone: Europe/London
theme: minima

author: AI Wales
email: jay@aiwales.org
twitter_username: aiwales
github_username: AI-Wales

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

collections:
  talks:
    output: true
    permalink: /talks/:year/:slug/

defaults:
  - scope:
      path: ""
      type: talks
    values:
      layout: talk

exclude:
  - _templates
  - README.md
